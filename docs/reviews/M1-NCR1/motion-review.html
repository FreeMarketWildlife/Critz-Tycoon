<!doctype html><meta charset="utf-8"><title>NCR1 internal four-direction paired review</title><style>body{font:12px monospace;color:#242330;background:#eee8d1;margin:12px}h1{font-size:17px}.row{display:flex;width:1140px;height:226px}.cell{width:190px;position:relative}.cell .big{image-rendering:pixelated;width:96px;height:192px;margin:4px 18px 0 12px}.cell .native{image-rendering:pixelated;position:absolute;left:125px;top:105px}button,select{font:inherit}h2{font-size:14px;margin:8px 0}#clock{margin:8px}</style><h1>INTERNAL NCR1 — native cluster cleanup / family material consistency</h1><p>Existing source holds. South800ms; other directions540ms. Hand-authored native clusters; source shoe/contact shape retained. No gameplay/creator installation.</p><button id="pause">Pause</button> <button id="step">Next slot</button> <button id="idle">Static idle</button> <label>Speed<select id="speed"><option value="1">Normal</option><option value="4">Slow4x</option></select></label><div id="clock"></div><main id="panels"></main><script>
const order=['A','A','P','P','C','C','P','P'],dirs=['south','north','west','east'];let playing=true,slot=0,start=performance.now(),staticIdle=false;const panels=document.getElementById('panels');for(const dr of dirs){const h=document.createElement('h2');h.textContent=dr;panels.append(h);const row=document.createElement('div');row.className='row';for(const pair of [['master-hero.png','AFTER MASTER32 HERO'],['master-bald.png','AFTER MASTER32 BALD'],['native-hero.png','AFTER NATIVE16 HERO'],['native-bald.png','AFTER NATIVE16 BALD']]){const cell=document.createElement('div');cell.className='cell';const title=document.createElement('div');title.textContent=pair[1];cell.append(title);for(const cls of ['big','native']){const im=document.createElement('img');im.className=cls;im.dataset.dr=dr;im.dataset.file=pair[0];im.alt=dr+' '+pair[1]+' '+cls;cell.append(im)}row.append(cell)}panels.append(row)}function display(){let text=[];const elapsed=performance.now()-start,slow=+document.getElementById('speed').value;for(const dr of dirs){const holds=(dr==='south'?[100,100,100,100,100,100,100,100]:[70,60,70,70,70,60,70,70]).map(x=>x*slow);let n=slot;if(playing){let t=elapsed%holds.reduce((a,b)=>a+b,0);n=0;while(n<7&&t>=holds[n])t-=holds[n++]}const po=staticIdle?'idle':order[n];text.push(dr+':'+po+' '+(n+1)+'/8');for(const im of document.querySelectorAll('img[data-dr="'+dr+'"]')){const src=dr+'-'+po+'/'+im.dataset.file;if(im.getAttribute('src')!==src)im.src=src}}document.getElementById('clock').textContent=(playing?'Playing ':'Paused ')+text.join(' | ')}document.getElementById('pause').onclick=()=>{playing=!playing;staticIdle=false;start=performance.now();document.getElementById('pause').textContent=playing?'Pause':'Play';display()};document.getElementById('step').onclick=()=>{playing=false;staticIdle=false;slot=(slot+1)%8;document.getElementById('pause').textContent='Play';display()};document.getElementById('idle').onclick=()=>{playing=false;staticIdle=true;document.getElementById('pause').textContent='Play';display()};function tick(){if(playing)display();requestAnimationFrame(tick)}display();tick();
</script>
