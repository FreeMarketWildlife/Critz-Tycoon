<!doctype html><meta charset="utf-8"><title>SR2 internal material cycle</title><style>body{background:#eee8d1;color:#242330;font:13px monospace}.row{display:flex;gap:18px;margin:15px 0}section{width:220px}img{image-rendering:pixelated;vertical-align:bottom}.native{width:32px;height:64px;margin-right:20px}.large{width:96px;height:192px}h1{font-size:17px}</style><h1>INTERNAL SR2 — source silhouette, changed material surfaces</h1><div id="clock"></div><div id="panels"></div><script>const order=['A','A','P','P','C','C','P','P'],holds=[70,60,70,70,70,60,70,70].map(x=>x*4);const total=holds.reduce((a,b)=>a+b,0);const parent=document.getElementById('panels');for(const dr of ['west','east']){const h=document.createElement('h2');h.textContent=dr;parent.append(h);const row=document.createElement('div');row.className='row';for(const pair of [['Before','before-hero.png'],['SR2','final-hero.png'],['Shared bald','final-template.png']]){const s=document.createElement('section');s.textContent=pair[0]+' native1x +3x';for(const k of ['native','large']){const im=document.createElement('img');im.className=k;im.dataset.dr=dr;im.dataset.file=pair[1];s.append(im)}row.append(s)}parent.append(row)}const start=performance.now();let last=-1;function show(){const t=performance.now()-start;let n=0,phase=t%total;while(n<7&&phase>=holds[n])phase-=holds[n++];if(n!==last){for(const im of document.images)im.src=im.dataset.dr+'-'+order[n]+'/'+im.dataset.file;last=n}document.getElementById('clock').textContent='Slow exact source slot '+(n+1)+'/8 '+order[n]+' cycle '+Math.floor(t/total);requestAnimationFrame(show)}show()</script>
