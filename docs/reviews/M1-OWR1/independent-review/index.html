<!doctype html><meta charset="utf-8"><title>Cast motion — isolated review</title><style>body{font:14px system-ui;background:#e6e4d8;color:#172326;margin:16px}h1{font-size:19px}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0 24px}.card{background:#b9c8c4;padding:8px}.pair{display:flex;gap:16px;align-items:flex-end}canvas{image-rendering:pixelated;width:96px;height:192px}canvas.native{width:32px;height:64px}p{margin:5px 0}.slot{font-family:monospace}</style><h1 id="title"></h1><p>Normal: 8 source updates/pose; slow review: 4×. Whole head/body only rigid measured vertical bob; no runtime integration.</p><div id="root"></div><p id="clock"></p><script type="module">
const char=new URLSearchParams(location.search).get('character')||'girl';document.querySelector('#title').textContent=char+' — four-direction motion study / unapproved';
const dirs=['south','north','west','east'],order=['A','idle','B','idle'],tick=280896/16777216*1000,hold=8*tick,imgs={},cards=[],seen={normal:new Set,slow:new Set};
const paths=(d,p)=>char==='girl'?`/docs/reviews/M1-OGH3/${d}/${p==='A'?'stride-a':p==='B'?'stride-b':'idle'}/composite.png`:`/docs/reviews/M1-ON3/${d}-${p}.png`;
await Promise.all(dirs.flatMap(d=>['A','idle','B'].map(p=>new Promise((res,rej)=>{const im=new Image;im.onload=()=>{imgs[d+p]=im;res()};im.onerror=rej;im.src=paths(d,p)}))));
for(const [speed,factor]of [['normal',1],['slow',4]]){const section=document.createElement('section');section.innerHTML=`<b>${speed.toUpperCase()}</b><div class="row"></div>`;document.querySelector('#root').append(section);for(const d of dirs){const card=document.createElement('div');card.className='card';card.innerHTML=`<p>${d}</p><div class="pair"><canvas width="32" height="64"></canvas><canvas class="native" width="32" height="64"></canvas></div><p class="slot"></p>`;section.querySelector('.row').append(card);cards.push({speed,factor,d,canvases:[...card.querySelectorAll('canvas')],label:card.querySelector('.slot')})}}
let start=performance.now();window.reviewState={ready:true,char,hold,loop:hold*4};function render(t){const elapsed=t-start;for(const c of cards){const slot=Math.floor(elapsed/(hold*c.factor))%4,pose=order[slot];seen[c.speed].add(slot);for(const cv of c.canvases){const ctx=cv.getContext('2d');ctx.clearRect(0,0,32,64);ctx.drawImage(imgs[c.d+pose],0,0)}c.label.textContent=`${pose} · slot${slot+1}/4`;c.slot=slot;c.pose=pose}window.reviewState={ready:true,char,elapsed,hold,loop:hold*4,seen:{normal:[...seen.normal],slow:[...seen.slow]},cards:cards.map(c=>({speed:c.speed,d:c.d,slot:c.slot,pose:c.pose,png:c.canvases[0].toDataURL()}))};document.querySelector('#clock').textContent=`Source-clock elapsed ${Math.round(elapsed)}ms | exact loop ${hold*4}ms`;requestAnimationFrame(render)}requestAnimationFrame(render);
</script>
